name: KNMI-data bijwerken

on:
  schedule:
    - cron: "30 10 * * *"   # dagelijks, na de KNMI-publicatie
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Data ophalen (laatste twee jaar + stationsoverzicht)
        run: python scripts/build_data.py --recent
      - name: Wijzigingen committen
        run: |
          if git diff --quiet -- data; then
            echo "Geen nieuwe KNMI-data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "KNMI-data bijgewerkt tot $(date -u +%F)"
          git push
